    image : "images/about/about-ppme.webp"
    content : "PPME Den Haag is een levendige islamitische gemeenschap in Moskee Al Hikmah. Elke week komen jong en oud samen voor het zaterdagprogramma, Koranlessen voor kinderen, lezingen, jongerenavonden en sociale acties. Iedereen is welkom, ook als je net begint.\n\nOok voor de belangrijkste momenten in je leven staan we klaar: als je wilt trouwen volgens de islam, of als je de stap wilt zetten om moslim te worden."
