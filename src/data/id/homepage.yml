    image : "images/about/about-ppme.webp"
    content : "PPME Den Haag adalah komunitas Muslim yang hidup dan aktif di Masjid Al Hikmah. Setiap pekan jamaah dari anak-anak hingga dewasa berkumpul dalam pengajian Sabtu, TPA, kajian, program remaja, serta kegiatan sosial. Semua orang diterima dengan tangan terbuka, termasuk yang baru mulai belajar.\n\nKami juga mendampingi momen terpenting dalam hidup Anda: jika Anda ingin menikah secara Islam, atau ingin mengucapkan syahadat dan menjadi mualaf."
