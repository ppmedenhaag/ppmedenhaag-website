  about:
    enable : true
    title : "About PPME Den Haag"
    image : "images/about/about-ppme.webp"
    content : "PPME Den Haag is a lively Muslim community at Masjid Al Hikmah. Every week young and old come together for the Saturday programme, children's Quran classes, talks, youth evenings and charity drives. Everyone is welcome, including those just starting out.\n\nWe are also here for the most important moments in your life: if you wish to marry according to Islam, or take the step of becoming Muslim."
