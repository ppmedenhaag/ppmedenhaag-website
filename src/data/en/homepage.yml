  ######################## Vision Mission #############################
  vision_mission:
    enable : false
    bg_image : "images/backgrounds/success-story.webp"
    vision_title : "Our Vision"
    mission_title : "Our Mission"
    vision : "Our vision is to build an association that is open to all Muslims and that fosters brotherhood and sisterhood among them. An association that consists of a close-knit community, in which young and old feel at home and actively and consciously live Islam together. We are a modern and future-oriented association that strives for progress and where possible we use technology to support and facilitate our members. Future-oriented also means that, in addition to actively and consciously experiencing Islam, we also want to make an active contribution to a sustainable and committed society. PPME is at the heart of society."
    mission : "Our mission is – in line with Ahlus Sunnah wal Jama’ah – to support our members in their personal and religious development. In addition, we want to spread the positive image of Islam and strengthen understanding of Islam and thus invite more people to join Islam. We want to make an important contribution to society with the opportunities that we have as a community. In this way we want to work on the development of active and conscious Muslims who profess their faith according to the teachings of Ahlus Sunnah wal Jama’ah, build bridges and thus make a positive impact on society."


