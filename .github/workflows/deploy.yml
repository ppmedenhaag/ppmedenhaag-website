name: Build and deploy

# On every push to main: build the Astro site and deploy it to Cloudflare as a Worker with static assets
# (https://ppme-website.ppme-registration.workers.dev). DNS for ppmedenhaag.nl is NOT touched.
# Required repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit), CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    # Documentation-only commits don't change the site.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
  # The prayer-time page shows the build-time (Amsterdam) year: rebuild just after midnight on 1 January.
  schedule:
    - cron: "30 0 1 1 *"

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Optional: zone id of ppmedenhaag.nl -> enables the cache purge after each deploy (token needs "Zone > Cache Purge").
      CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      # SEO origin: production = repo variable PUBLIC_SITE_URL=https://www.ppmedenhaag.nl (set at the 2026-11-21 cutover).
      # If it is ever empty the code default is the staging origin https://website-v2.ppmedenhaag.nl (src/data/seo.ts),
      # so this step warns loudly instead of silently shipping staging canonicals to the live site.
      - name: SEO target check
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          TARGET="${PUBLIC_SITE_URL:-https://website-v2.ppmedenhaag.nl}"
          if [ "$TARGET" = "https://www.ppmedenhaag.nl" ]; then
            echo "### PRODUCTION deploy (SEO targets $TARGET)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=STAGING build::PUBLIC_SITE_URL is not https://www.ppmedenhaag.nl (SEO targets $TARGET). The live site is on www: restore the repo variable unless this is an intentional rollback (docs/seo/ROLLBACK-PLAN.md)."
            {
              echo "### STAGING build: PUBLIC_SITE_URL is not the production origin"
              echo "SEO (canonical, og:*, sitemap, RSS) points to **$TARGET**, but www.ppmedenhaag.nl is served by this Worker."
              echo "Restore the repo variable \`PUBLIC_SITE_URL=https://www.ppmedenhaag.nl\` unless you are rolling back (\`docs/seo/ROLLBACK-PLAN.md\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          SEO_AUDIT_MODE: ${{ vars.PUBLIC_SITE_URL == 'https://www.ppmedenhaag.nl' && 'production' || 'staging' }}
      - name: Check credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."; exit 1
          fi
      - run: npx wrangler deploy
      # HTML is edge-cached for up to 1 h (+ stale-while-revalidate, public/_headers). Purge so a deploy is visible at once and
      # no edge keeps serving old HTML that points at CSS/JS files of the previous build. Skipped until the secret exists.
      - name: Purge Cloudflare cache
        if: ${{ env.CLOUDFLARE_ZONE_ID != '' }}
        continue-on-error: true
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
      # Production only: notify Bing/Yandex (IndexNow) about the new/changed URLs. Never fails the deploy.
      - name: IndexNow ping
        if: ${{ vars.PUBLIC_SITE_URL == 'https://www.ppmedenhaag.nl' }}
        continue-on-error: true
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: node scripts/indexnow.mjs
