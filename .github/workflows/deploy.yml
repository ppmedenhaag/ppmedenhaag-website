name: Build and deploy

# On every push to main: build the Astro site and deploy it to Cloudflare as a Worker with static assets
# (https://ppme-website.ppme-registration.workers.dev). DNS for ppmedenhaag.nl is NOT touched.
# Required repository secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit), CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
    # Documentation-only commits don't change the site.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
  # The prayer-time page shows the build-time (Amsterdam) year: rebuild just after midnight on 1 January.
  schedule:
    - cron: "30 0 1 1 *"

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      # SEO origin: until the cutover this is empty -> default https://website-v2.ppmedenhaag.nl (src/data/seo.ts).
      # The cutover sets the repo variable PUBLIC_SITE_URL=https://www.ppmedenhaag.nl (docs/seo/PROGRESS.md).
      - name: SEO target reminder
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          TARGET="${PUBLIC_SITE_URL:-https://website-v2.ppmedenhaag.nl}"
          if [ "$TARGET" = "https://www.ppmedenhaag.nl" ]; then
            echo "### PRODUCTION deploy (SEO targets $TARGET)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning title=STAGING deploy::SEO still targets $TARGET and the site is noindexed. Cutover to www/apex is PENDING (docs/seo/PROGRESS.md, Phase 10)."
            {
              echo "### STAGING deploy: cutover pending"
              echo "SEO (canonical, og:*, sitemap, RSS) points to **$TARGET**; non-production hosts are noindexed."
              echo "To go live set the repo variable \`PUBLIC_SITE_URL=https://www.ppmedenhaag.nl\`, then follow Phase 10 in \`docs/seo/SEO-PLAN.md\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm run build
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          SEO_AUDIT_MODE: ${{ vars.PUBLIC_SITE_URL == 'https://www.ppmedenhaag.nl' && 'production' || 'staging' }}
      - name: Check credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Set the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets."; exit 1
          fi
      - run: npx wrangler deploy
      # Production only: notify Bing/Yandex (IndexNow) about the new/changed URLs. Never fails the deploy.
      - name: IndexNow ping
        if: ${{ vars.PUBLIC_SITE_URL == 'https://www.ppmedenhaag.nl' }}
        continue-on-error: true
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: node scripts/indexnow.mjs
